name: Refresh winter conditions data

# Snapshot for the homepage winter conditions panel. This site is a single
# Cloudflare Worker (wrangler deploy, no Pages git integration), so
# refreshing the data requires an actual `wrangler deploy`, not just a
# commit. If the fetch fails, fetch-weather.js still writes an all-fallback
# snapshot, so the panel degrades to plain source links rather than showing
# stale numbers.
#
# Requires a CLOUDFLARE_API_TOKEN repo secret (Workers Scripts: Edit
# permission) for the deploy step to run.
#
# Schedule: Winter season only (May 30 to October 31). Disabled outside winter.
# Runs once daily at 6:15am NZ local time.
# GitHub Actions cron is UTC-only:
#  - NZST (UTC+12) during winter: 18:15 UTC = 6:15am NZST (June–Sept + May 30-31).
#  - NZDT (UTC+13) in October: 17:15 UTC = 6:15am NZDT.
on:
  schedule:
    - cron: '15 18 * 6-9 *'       # 6:15am NZST daily (June to Sept)
    - cron: '15 17 * 10 *'        # 6:15am NZDT daily (October, daylight saving)
    - cron: '15 18 29-31 5 *'     # 6:15am NZST daily (May 30-31 season open)
  workflow_dispatch:
    inputs:
      force:
        description: 'Force weather fetch outside winter season'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: node scripts/fetch-weather.js ${{ inputs.force && '--force' || '' }}

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- src/data/winter-conditions.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/winter-conditions.json
          git commit -m "chore: refresh winter conditions data"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy
        if: steps.commit.outputs.changed == 'true'
        run: npx astro build && npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
